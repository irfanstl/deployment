[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route all /api/* calls to the Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Route all other paths to index.html for React SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
